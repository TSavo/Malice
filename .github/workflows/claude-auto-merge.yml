name: Claude Auto Merge

on:
  issue_comment:
    types: [created]

jobs:
  claude-merge:
    # Only run if:
    # 1. Comment is on a PR
    # 2. Comment has the review marker
    # 3. Comment contains LGTM (approved)
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '<!-- CLAUDE_REVIEW_MARKER -->') &&
      contains(github.event.comment.body, 'LGTM')

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Wait for checks and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🎉 Claude approved PR #${{ github.event.issue.number }}"
          echo "⏳ Waiting for all checks to complete..."

          # Wait for all checks to pass (timeout after 30 minutes)
          gh pr checks ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --watch \
            --fail-level all

          echo "✅ All checks passed - merging..."

          # Merge with squash
          gh pr merge ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --delete-branch

          echo "✅ PR merged successfully"
