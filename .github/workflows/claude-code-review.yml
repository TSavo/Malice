name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  # Allow fixer to re-trigger review after pushing fixes
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

# Prevent multiple review cycles from running simultaneously
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Skip if PR title indicates it was already fixed (only for pull_request events)
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.pull_request.title, '[claude-fixed]')

    runs-on: [self-hosted, malice]
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Get PR details for workflow_dispatch
        id: pr-info
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh pr view ${{ github.event.inputs.pr_number }} --repo ${{ github.repository }} --json headRefName)
          echo "branch=$(echo $PR_DATA | jq -r '.headRefName')" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT

      - name: Set PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "branch=${{ steps.pr-info.outputs.branch }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "branch=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-number.outputs.branch }}
          lfs: false

      - name: Wait for other reviewers to finish
        run: |
          echo "⏳ Waiting 6 minutes for other review bots to complete..."
          sleep 360
          echo "✅ Proceeding with review"

      - name: Check iteration count
        id: check-iterations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count how many Claude review cycles have happened
          REVIEW_COUNT=$(gh pr view ${{ steps.pr-number.outputs.number }} --json comments \
            --jq '[.comments[] | select(.body | contains("<!-- CLAUDE_REVIEW_MARKER -->"))] | length')
          echo "review_count=$REVIEW_COUNT" >> $GITHUB_OUTPUT

          # Max 20 iterations to prevent runaway loops
          if [ "$REVIEW_COUNT" -ge 20 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::Max review iterations (20) reached. Stopping review loop."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review
        if: steps.check-iterations.outputs.skip != 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: /usr/local/bin/claude
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr-number.outputs.number }}
            REVIEW ITERATION: ${{ steps.check-iterations.outputs.review_count }}

            You are the REVIEWER agent in a two-agent feedback loop. Your job is to review code and provide actionable feedback.

            ## CRITICAL: Read ALL Existing Comments and Reviews First

            Before doing your own review, you MUST read all existing comments and code reviews on this PR:

            ```bash
            # Get ALL PR comments (from bots and humans)
            gh pr view ${{ steps.pr-number.outputs.number }} --json comments,reviews \
              --jq '.comments[].body, .reviews[].body'

            # Get ALL inline code review comments (line-specific feedback)
            gh api repos/${{ github.repository }}/pulls/${{ steps.pr-number.outputs.number }}/comments \
              --jq '.[] | {author: .user.login, path: .path, line: .line, body: .body}'
            ```

            ## Your Task

            1. **Read ALL existing comments and reviews** using the commands above
            2. Review the PR diff yourself for anything others missed
            3. Check for: bugs, security issues, performance problems, code quality, test coverage
            4. Use CLAUDE.md for project conventions
            5. For world/building files (src/database/bootstrap/world/**), verify:
               - Room coordinates (x, y, z) fall within declared building footprint
               - Building footprint formula: x ∈ [x - width + 1, x], y ∈ [y - height + 1, y]
               - Exit bi-directionality: if room A exits north to room B, room B must exit south to room A
               - Stair exits: stairs going up (z+1) must have corresponding stairs down (z-1)
               - Street exits: rooms at z=0 with street exits must connect to valid street coordinates

            ## Verdict Logic

            Your verdict MUST consider ALL existing feedback:
            - If ANY reviewer (human or bot) found critical/blocking issues → "Changes Requested"
            - Evaluate whether reported issues are valid and still outstanding
            - Your job is to synthesize all feedback into a final verdict

            ## Response Format

            You MUST respond with a structured review comment using `gh pr comment`.

            CRITICAL: Your comment body MUST begin with exactly these 29 characters (no escaping, no backslashes, copy verbatim):
            <!-- CLAUDE_REVIEW_MARKER -->

            Do NOT escape the exclamation mark. Do NOT use backslashes. The marker must be a valid HTML comment.

            After the marker, include a verdict heading: "## ✅ LGTM" or "## 🔧 Changes Requested"

            Structure your review:
            1. **Existing Review Findings** - Summarize issues found by other reviewers and whether you agree
            2. **Additional Issues** - Any issues you found that others missed
            3. **Verdict** - Your final decision considering ALL findings

            If changes requested, list SPECIFIC issues with file paths, line numbers, and exact fixes needed.
            If everything looks good, just say the code looks good.

            ## Important

            - Be specific with file paths and line numbers
            - Only flag real issues, not style preferences
            - If this is iteration 2+, focus only on NEW issues (previous ones should be fixed)
            - The fixer agent will read your comment and implement changes automatically
            - DO NOT ignore critical issues found by other reviewers

            Use `gh pr comment ${{ steps.pr-number.outputs.number }} --body "YOUR_REVIEW"` to post.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*)"'

