name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

# Prevent multiple review cycles from running simultaneously
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Skip if PR title indicates it was already fixed
    if: "!contains(github.event.pull_request.title, '[claude-fixed]')"

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Check iteration count
        id: check-iterations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count how many Claude review cycles have happened
          REVIEW_COUNT=$(gh pr view ${{ github.event.pull_request.number }} --json comments \
            --jq '[.comments[] | select(.body | contains("<!-- CLAUDE_REVIEW_MARKER -->"))] | length')
          echo "review_count=$REVIEW_COUNT" >> $GITHUB_OUTPUT

          # Max 10 iterations to prevent runaway loops
          if [ "$REVIEW_COUNT" -ge 10 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::Max review iterations (10) reached. Stopping review loop."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review
        if: steps.check-iterations.outputs.skip != 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW ITERATION: ${{ steps.check-iterations.outputs.review_count }}

            You are the REVIEWER agent in a two-agent feedback loop. Your job is to review code and provide actionable feedback.

            ## Your Task
            1. Review the PR diff thoroughly
            2. Check for: bugs, security issues, performance problems, code quality, test coverage
            3. Use CLAUDE.md for project conventions

            ## Response Format
            You MUST respond with a structured review comment using `gh pr comment`.

            CRITICAL: Your comment body MUST begin with exactly these 29 characters (no escaping, no backslashes, copy verbatim):
            <!-- CLAUDE_REVIEW_MARKER -->

            Do NOT escape the exclamation mark. Do NOT use backslashes. The marker must be a valid HTML comment.

            After the marker, include a verdict heading: "## ✅ LGTM" or "## 🔧 Changes Requested"

            If changes requested, list SPECIFIC issues with file paths, line numbers, and exact fixes needed.
            If everything looks good, just say the code looks good.

            ## Important
            - Be specific with file paths and line numbers
            - Only flag real issues, not style preferences
            - If this is iteration 2+, focus only on NEW issues (previous ones should be fixed)
            - The fixer agent will read your comment and implement changes automatically

            Use `gh pr comment ${{ github.event.pull_request.number }} --body "YOUR_REVIEW"` to post.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

