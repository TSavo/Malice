name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

# Prevent multiple reviews from running simultaneously
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  claude-review:
    # Skip if PR title indicates it was already fixed (only for pull_request events)
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.pull_request.title, '[claude-fixed]')

    runs-on: [self-hosted, malice]
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: write

    steps:
      - name: Get PR details for workflow_dispatch
        id: pr-info
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh pr view ${{ github.event.inputs.pr_number }} --repo ${{ github.repository }} --json headRefName)
          echo "branch=$(echo $PR_DATA | jq -r '.headRefName')" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT

      - name: Set PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "branch=${{ steps.pr-info.outputs.branch }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "branch=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-number.outputs.branch }}
          lfs: false

      - name: Check iteration count
        id: check-iterations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count how many Claude review cycles have happened
          REVIEW_COUNT=$(gh pr view ${{ steps.pr-number.outputs.number }} --json comments \
            --jq '[.comments[] | select(.body | contains("<!-- CLAUDE_REVIEW_MARKER -->"))] | length')
          echo "review_count=$REVIEW_COUNT" >> $GITHUB_OUTPUT

          # Max 20 iterations to prevent runaway loops
          if [ "$REVIEW_COUNT" -ge 20 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::Max review iterations (20) reached. Stopping review loop."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review
        if: steps.check-iterations.outputs.skip != 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: /usr/local/bin/claude
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr-number.outputs.number }}
            REVIEW ITERATION: ${{ steps.check-iterations.outputs.review_count }}

            You are a CODE REVIEWER. Your job is to review the CURRENT code state and report any issues.

            ## Step 1: Read Existing Comments to Understand History

            ```bash
            # Get ALL PR comments to see what was previously reported
            gh pr view ${{ steps.pr-number.outputs.number }} --json comments \
              --jq '.comments[] | select(.body | test("CLAUDE_REVIEW_MARKER|CLAUDE_FIXER_MARKER")) | .body'
            ```

            ## Step 2: VERIFY Previously Reported Issues Are Actually Fixed

            CRITICAL: For EACH issue mentioned in previous reviews, you MUST:
            1. Use the Read tool to check the CURRENT file contents
            2. Verify whether the issue still exists in the current code
            3. Do NOT report an issue as outstanding if it has been fixed

            Example: If a previous review said "line 654 has the 's' flag", READ the file and check if line 654 still has that issue.

            ## Step 3: Review the PR Diff for NEW Issues

            1. Use `gh pr diff` to see what changed
            2. Check for: bugs, security issues, performance problems, code quality
            3. Use CLAUDE.md for project conventions

            ## Step 4: Post Your Review

            Use `gh pr comment` to post your findings.

            CRITICAL: Your comment body MUST begin with exactly:
            <!-- CLAUDE_REVIEW_MARKER -->

            Then include a heading: "## 🔍 Code Review"

            Structure:
            1. **Previously Reported Issues** - For each issue from prior reviews, state whether it's FIXED or STILL PRESENT (with evidence from reading the file)
            2. **New Issues Found** - Any NEW issues not previously reported
            3. **Suggestions** - Optional improvements (clearly marked as non-blocking)

            If ALL previously reported issues are fixed AND no new issues found, say:
            "No issues found. All previously reported issues have been addressed."

            DO NOT give a verdict (LGTM/Changes Requested). The verdict bot handles that separately.

            ## Important

            - ALWAYS READ THE ACTUAL FILES before reporting an issue still exists
            - Do NOT just repeat issues from previous comments without verifying
            - Be specific with file paths and line numbers

            Use `gh pr comment ${{ steps.pr-number.outputs.number }} --body "YOUR_REVIEW"` to post.

          claude_args: '--allowed-tools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*)"'

      - name: Trigger LGTM verdict workflow
        if: steps.check-iterations.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Triggering LGTM verdict workflow for PR #${{ steps.pr-number.outputs.number }}"
          gh workflow run claude-lgtm.yml \
            --repo ${{ github.repository }} \
            --field pr_number=${{ steps.pr-number.outputs.number }}
