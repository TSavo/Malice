name: Claude Test Coverage

on:
  pull_request:
    types: [opened, synchronize]

# Prevent multiple coverage checks from running simultaneously
concurrency:
  group: claude-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Test Coverage
        id: claude-coverage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BRANCH: ${{ github.event.pull_request.head.ref }}

            You are an AGGRESSIVE TEST COVERAGE agent. Your job is to ensure all new code has test coverage.

            ## Step 1: Identify Changed Source Files
            Run `gh pr diff ${{ github.event.pull_request.number }}` to see what changed.
            Focus on source files in src/**/*.ts - ignore test files, configs, markdown, workflows.

            ## Step 2: Check for Existing Tests
            For each changed source file (e.g., src/foo/bar.ts), search for:
            - test/foo/bar.test.ts
            - test/**/bar.test.ts
            - Any test file that imports from the changed file

            Use `find test -name "*.test.ts"` and grep to check.

            ## Step 3: Decision - BE AGGRESSIVE

            You MUST add tests if ANY of these are true:
            - The changed file has NO corresponding test file
            - New exported functions/classes were added without tests
            - New HTTP endpoints, API routes, or handlers were added
            - More than 50 lines of logic were added

            You may SKIP tests ONLY if ALL of these are true:
            - Changes are purely type definitions (interfaces, types)
            - OR changes are only import/export reorganization
            - OR comprehensive tests already exist for the changed code

            ## Step 4: Write Tests

            If tests are needed:
            1. Create test file matching the source path: src/foo/bar.ts → test/foo/bar.test.ts
            2. Write tests using vitest (describe/it/expect pattern)
            3. Test the PUBLIC API - exported functions, class methods, handlers
            4. For HTTP endpoints: test request/response, status codes, error cases
            5. Run `npm test -- [your-test-file]` to verify tests pass
            6. Commit: `git add . && git commit -m "test: add coverage for [description]"`
            7. Push: `git push origin ${{ github.event.pull_request.head.ref }}`
            8. Comment on PR with (no escaping, no backslashes):
               <!-- CLAUDE_COVERAGE_MARKER -->
               ## 🧪 Test Coverage Added

               Added tests for:
               - [list what you tested]

               Commit: `[hash]`

            If tests genuinely aren't needed (types only, tests exist), exit silently.

            ## Test Patterns
            Look at existing tests in test/ for patterns. Use vitest:
            ```typescript
            import { describe, it, expect } from 'vitest';
            describe('ClassName', () => {
              it('should do something', () => {
                expect(result).toBe(expected);
              });
            });
            ```

          claude_args: '--allowed-tools "Bash(git:*),Bash(npm test:*),Bash(npm run test:*),Bash(find:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr view:*),Read,Edit,Write,Glob,Grep"'
