name: Build Base Images

on:
  push:
    branches: [master]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'Dockerfile.base'
      - 'docker/github-runner/Dockerfile.base'
  workflow_dispatch:

jobs:
  build-game-base:
    runs-on: [self-hosted, malice]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push game base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: |
            tsavo/malice-base:latest
            tsavo/malice-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-runner-base:
    runs-on: [self-hosted, malice]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push runner base image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/github-runner
          file: ./docker/github-runner/Dockerfile.base
          push: true
          tags: |
            tsavo/malice-runner-base:latest
            tsavo/malice-runner-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
