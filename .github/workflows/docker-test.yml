name: Docker Build & Reset Test

on:
  push:
    branches: [master, claude/*]
  pull_request:
    branches: [master]
  workflow_dispatch:  # Allow manual trigger

jobs:
  docker-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build game container
        run: docker compose build game

      - name: Start MongoDB
        run: |
          docker compose up -d mongodb
          echo "Waiting for MongoDB to be healthy..."
          timeout 60 bash -c 'until docker compose ps mongodb | grep -q healthy; do sleep 2; done' || {
            echo "ERROR: MongoDB timed out"
            docker compose logs mongodb --tail=20
            exit 1
          }
          echo "MongoDB is healthy"

      - name: Drop database
        run: |
          docker exec malice-mongo mongosh --quiet --eval 'db.dropDatabase()' malice

      - name: Run bootstrap
        run: |
          docker compose run --rm game npx tsx src/scripts/bootstrap-world.ts --full

      - name: Start all services
        run: |
          docker compose up -d
          echo "Waiting for game server to be healthy..."
          timeout 120 bash -c 'until docker compose ps game | grep -q healthy; do sleep 3; done' || {
            echo "ERROR: Game server timed out"
            docker compose logs game --tail=50
            exit 1
          }
          echo "Game server is healthy"

      - name: Verify services
        run: |
          echo "=== Service Status ==="
          docker compose ps
          echo ""
          echo "=== Health Check: MCP Server ==="
          curl -sf http://localhost:3010/health || echo "MCP not responding (expected if no /health endpoint)"
          echo ""
          echo "=== Container Logs (last 50 lines) ==="
          docker compose logs --tail=50 game

      - name: Cleanup
        if: always()
        run: docker compose down -v
