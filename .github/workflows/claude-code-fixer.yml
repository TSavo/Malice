name: Claude Code Fixer

on:
  issue_comment:
    types: [created]

# Prevent multiple fixers from running simultaneously
concurrency:
  group: claude-fixer-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude-fixer:
    # Only run if:
    # 1. Comment is on a PR (not an issue)
    # 2. One of:
    #    a. Comment contains a Claude marker (review or verdict) requesting changes
    #       Note: Claude sometimes escapes ! as \! so we check for both variants
    #    b. Comment is exactly "/fix" (manual trigger)
    if: |
      github.event.issue.pull_request &&
      (
        (
          (contains(github.event.comment.body, 'CLAUDE_VERDICT_MARKER') ||
           contains(github.event.comment.body, 'CLAUDE_REVIEW_MARKER')) &&
          contains(github.event.comment.body, 'Changes Requested')
        ) ||
        github.event.comment.body == '/fix'
      )

    runs-on: [self-hosted, malice]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write  # Required to trigger workflow_dispatch on other workflows

    steps:
      - name: Get PR details
        id: pr-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName,headRepository,headRepositoryOwner)
          echo "branch=$(echo $PR_DATA | jq -r '.headRefName')" >> $GITHUB_OUTPUT
          echo "repo=$(echo $PR_DATA | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-details.outputs.branch }}
          # Use PAT to allow push to trigger workflows (GITHUB_TOKEN doesn't trigger workflows)
          token: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          lfs: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Claude Code Fixer
        id: claude-fixer
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: /usr/local/bin/claude
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}
            BRANCH: ${{ steps.pr-details.outputs.branch }}

            You are the FIXER agent in a two-agent feedback loop. The REVIEWER agent has left feedback that you need to address.

            ## Triggering Review Comment
            ```
            ${{ github.event.comment.body }}
            ```

            ## CRITICAL: Read ALL PR Comments First

            Before making any fixes, you MUST read the complete PR conversation to understand all feedback:

            ```bash
            # Get ALL comments (reviews, discussions, line comments)
            gh pr view ${{ github.event.issue.number }} --json comments,reviews --jq '.comments[], .reviews[]'

            # Get inline review comments on specific lines
            gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/comments
            ```

            ## Categorize All Feedback

            As you read through comments, build a complete list of ALL requested changes:

            1. **CLAUDE_REVIEW_MARKER comments** - Automated reviewer feedback (prioritize these)
            2. **Human review comments** - Manual feedback from maintainers (important!)
            3. **Inline code comments** - Line-specific suggestions (gh api output)
            4. **CLAUDE_FIXER_MARKER comments** - Previous fix attempts (check if issues persist)

            For each piece of feedback, determine:
            - Is it already fixed? (check current code)
            - Is it still outstanding?
            - Was a previous fix attempt unsuccessful?

            ## Your Task

            1. **Read all PR comments** using the commands above
            2. **Build a complete issue list** from ALL sources (not just the triggering comment)
            3. Rebase on master: `git fetch origin master && git rebase origin/master`
            4. For each outstanding issue, implement the fix
            5. Stage and commit your changes
            6. Push the changes to the PR branch
            7. Leave a comprehensive summary comment

            ## Important Rules
            - Address ALL outstanding issues from ALL reviewers (human and automated)
            - Check if issues from previous review cycles are actually fixed
            - Do NOT add new features or make unrelated changes
            - If you can't fix something, explicitly note it in your summary
            - Use atomic commits (one commit per logical fix if multiple issues)
            - Always run type checks before committing

            ## Workflow
            1. Read ALL comments: `gh pr view ${{ github.event.issue.number }} --json comments,reviews`
            2. Read inline comments: `gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/comments`
            3. Build complete list of outstanding issues
            4. Rebase: `git fetch origin master && git rebase origin/master`
            5. Read the files mentioned in reviews
            6. Make the requested changes using Edit tool
            7. Run type checking: `npm run typecheck` (fix any issues you introduced)
            8. Commit with message: "fix: [description of fix]"
            9. Push: `git push --force-with-lease origin ${{ steps.pr-details.outputs.branch }}`
            10. Comment on PR with comprehensive summary

            ## Summary Comment Format

            Your summary comment MUST begin with exactly these 28 characters (no escaping, no backslashes):
            <!-- CLAUDE_FIXER_MARKER -->

            Then add:
            ## 🔧 Fixes Applied

            ### From Automated Review (iteration N)
            - [x] Issue 1 - fixed in commit abc123
            - [x] Issue 2 - fixed in commit abc123

            ### From Human Reviews
            - [x] @username's feedback on file.ts - fixed in commit def456
            - [ ] @username's suggestion about X - could not fix because Y

            ### From Inline Comments
            - [x] Line comment on src/foo.ts:42 - addressed

            ### Previously Reported (verified fixed)
            - [x] Issue from iteration 1 - confirmed still fixed

          claude_args: '--allowed-tools "Bash(git:*),Bash(npm run typecheck),Bash(npm test:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh api:*),Read,Edit,Write,Glob,Grep"'

      # When PAT_GITHUB_TOKEN is configured, the push automatically triggers all
      # pull_request workflows. When only GITHUB_TOKEN is used, we manually trigger them.
      - name: Trigger workflows (fallback when no PAT)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Triggering workflows for PR #${{ github.event.issue.number }}"
          # Trigger code review (which will trigger LGTM when done)
          gh workflow run claude-code-review.yml \
            --repo ${{ github.repository }} \
            --field pr_number=${{ github.event.issue.number }}
          # Trigger tests
          gh workflow run claude-test-coverage.yml \
            --repo ${{ github.repository }} \
            --field pr_number=${{ github.event.issue.number }} || true
          # Trigger docs
          gh workflow run claude-docs.yml \
            --repo ${{ github.repository }} \
            --field pr_number=${{ github.event.issue.number }} || true
