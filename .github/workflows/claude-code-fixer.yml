name: Claude Code Fixer

on:
  issue_comment:
    types: [created]

# Prevent multiple fixers from running simultaneously
concurrency:
  group: claude-fixer-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude-fixer:
    # Only run if:
    # 1. Comment is on a PR (not an issue)
    # 2. Comment contains the review marker
    # 3. Comment contains "Changes Requested" (not LGTM)
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '<!-- CLAUDE_REVIEW_MARKER -->') &&
      contains(github.event.comment.body, 'Changes Requested')

    runs-on: [self-hosted, malice]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write  # Required to trigger workflow_dispatch on other workflows

    steps:
      - name: Get PR details
        id: pr-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName,headRepository,headRepositoryOwner)
          echo "branch=$(echo $PR_DATA | jq -r '.headRefName')" >> $GITHUB_OUTPUT
          echo "repo=$(echo $PR_DATA | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-details.outputs.branch }}
          # Use PAT to allow push to trigger workflows (GITHUB_TOKEN doesn't trigger workflows)
          token: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Claude Code Fixer
        id: claude-fixer
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: /usr/bin/claude
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}
            BRANCH: ${{ steps.pr-details.outputs.branch }}

            You are the FIXER agent in a two-agent feedback loop. The REVIEWER agent has left feedback that you need to address.

            ## Review Comment to Address
            ```
            ${{ github.event.comment.body }}
            ```

            ## Your Task
            1. First, rebase on master: `git fetch origin master && git rebase origin/master`
            2. Parse the review comment above for specific issues
            3. For each issue marked with **File:** and **Fix:**, implement the fix
            4. Stage and commit your changes with a descriptive message
            5. Push the changes to the PR branch (use --force-with-lease since you rebased)
            6. Leave a comment summarizing what you fixed

            ## Important Rules
            - Only fix issues explicitly mentioned in the review
            - Do NOT add new features or make unrelated changes
            - If you can't fix something, note it in your summary comment
            - Use atomic commits (one commit per logical fix if multiple issues)
            - Always run any relevant tests/type checks before committing

            ## Workflow
            1. Rebase on master: `git fetch origin master && git rebase origin/master`
            2. Read the files mentioned in the review
            3. Make the requested changes using Edit tool
            4. Run type checking: `npm run typecheck` (fix any issues you introduced)
            5. Commit with message: "fix: [description of fix]"
            6. Push: `git push --force-with-lease origin ${{ steps.pr-details.outputs.branch }}`
            7. Comment on PR: `gh pr comment ${{ github.event.issue.number }} --body "YOUR_SUMMARY"`

            Your summary comment MUST begin with exactly these 28 characters (no escaping, no backslashes):
            <!-- CLAUDE_FIXER_MARKER -->

            Then add a heading "## 🔧 Fixes Applied" followed by a checklist of what you fixed and the commit hash.

          claude_args: '--allowed-tools "Bash(git:*),Bash(npm run typecheck),Bash(npm test:*),Bash(gh pr comment:*),Bash(gh pr view:*),Read,Edit,Write,Glob,Grep"'

      # When PAT_GITHUB_TOKEN is configured, the push automatically triggers all
      # pull_request workflows. When only GITHUB_TOKEN is used, we manually trigger them.
      - name: Trigger workflows (fallback when no PAT)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Triggering workflows for PR #${{ github.event.issue.number }}"
          # Trigger review
          gh workflow run claude-code-review.yml \
            --repo ${{ github.repository }} \
            --field pr_number=${{ github.event.issue.number }}
          # Trigger tests
          gh workflow run claude-test-coverage.yml \
            --repo ${{ github.repository }} \
            --field pr_number=${{ github.event.issue.number }} || true
          # Trigger docs
          gh workflow run claude-docs.yml \
            --repo ${{ github.repository }} \
            --field pr_number=${{ github.event.issue.number }} || true
