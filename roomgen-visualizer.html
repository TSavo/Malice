<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Generator Visualizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      overflow: hidden;
    }
    #container { width: 100vw; height: 100vh; }
    #controls {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(20, 20, 30, 0.9);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #333;
      z-index: 100;
      min-width: 280px;
    }
    #controls h2 { 
      margin-bottom: 12px; 
      font-size: 14px; 
      color: #88f;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .control-group {
      margin-bottom: 12px;
    }
    .control-group label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    .control-group input[type="range"] {
      width: 100%;
      accent-color: #66f;
    }
    .control-group input[type="number"] {
      width: 80px;
      background: #1a1a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .control-row {
      display: flex;
      gap: 12px;
    }
    .control-row .control-group { flex: 1; }
    button {
      background: linear-gradient(135deg, #44f, #66a);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 8px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(68, 68, 255, 0.3);
    }
    button:active { transform: translateY(0); }
    #stats {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(20, 20, 30, 0.9);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      font-size: 12px;
      z-index: 100;
    }
    #stats div { margin: 4px 0; }
    #stats span { color: #8f8; font-weight: bold; }
    #info {
      position: fixed;
      bottom: 16px;
      left: 16px;
      font-size: 11px;
      color: #666;
    }
    .value-display {
      float: right;
      color: #aaf;
      font-weight: bold;
    }
    #editor-status {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(20, 20, 30, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #555;
      font-size: 12px;
      z-index: 100;
    }
    #editor-status .mode { color: #ff8; font-weight: bold; }
    #editor-status .z-level { color: #8ff; font-weight: bold; }
    #editor-status kbd {
      background: #333;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 2px 6px;
      margin: 0 2px;
    }
    .cursor-preview {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  
  <div id="controls">
    <h2>Room Generator</h2>
    
    <div class="control-group">
      <label>Seed <span class="value-display" id="seedVal">12345</span></label>
      <input type="number" id="seed" value="12345" min="1">
    </div>
    
    <div class="control-group">
      <label>Max Rooms <span class="value-display" id="maxRoomsVal">500</span></label>
      <input type="range" id="maxRooms" min="50" max="2000" value="500">
    </div>
    
    <div class="control-group">
      <label>Branch Chance <span class="value-display" id="branchChanceVal">0.20</span></label>
      <input type="range" id="branchChance" min="0" max="100" value="20">
    </div>
    
    <div class="control-group">
      <label>Linear Bias <span class="value-display" id="linearBiasVal">0.70</span></label>
      <input type="range" id="linearBias" min="0" max="200" value="70">
    </div>
    
    <div class="control-group">
      <label>Center Bias <span class="value-display" id="centerBiasVal">1.20</span></label>
      <input type="range" id="centerBias" min="0" max="300" value="120">
    </div>
    
    <div class="control-group">
      <label>Center Penalty <span class="value-display" id="centerPenaltyVal">0.90</span></label>
      <input type="range" id="centerPenalty" min="0" max="200" value="90">
    </div>
    
    <div class="control-group">
      <label>Prefab Chance <span class="value-display" id="prefabChanceVal">0.15</span></label>
      <input type="range" id="prefabChance" min="0" max="100" value="15">
    </div>
    
    <div class="control-group">
      <label>Link Preference <span class="value-display" id="linkPreferenceVal">0.80</span></label>
      <input type="range" id="linkPreference" min="0" max="100" value="80">
    </div>
    
    <button id="generate">Generate World</button>
    <button id="randomSeed" style="background: linear-gradient(135deg, #4a4, #6a6);">Random Seed</button>
    <button id="importJson" style="background: linear-gradient(135deg, #a64, #c86);">Import JSON</button>
    <input type="file" id="jsonFileInput" accept=".json" style="display: none;">
  </div>
  
  <div id="stats">
    <div>Rooms: <span id="roomCount">0</span></div>
    <div>Exits: <span id="exitCount">0</span></div>
    <div>Prefab Instances: <span id="prefabCount">0</span></div>
    <div>Connected: <span id="connected">-</span></div>
  </div>
  
  <div id="info">
    <kbd>WASD</kbd> move • Drag to rotate • Scroll to zoom • Right-drag to pan
  </div>
  
  <div id="editor-status">
    <div>Mode: <span class="mode" id="editorMode">ROOM</span> | Z: <span class="z-level" id="editorZ">-2</span></div>
    <div style="margin-top: 6px; color: #888;">
      <kbd>R</kbd> toggle mode • <kbd>Q</kbd>/<kbd>Z</kbd> adjust Z
    </div>
    <div style="margin-top: 4px; color: #888;">
      <kbd>Click</kbd> add • <kbd>Shift+Click</kbd> delete room/exit
    </div>
    <div style="margin-top: 4px; color: #888;">
      <kbd>T</kbd> cycle type • <kbd>E</kbd> export • <kbd>I</kbd> import
    </div>
    <div style="margin-top: 6px; font-size: 10px;">
      <span style="color: #4466aa;">■</span> room
      <span style="color: #886644;">■</span> railway
      <span style="color: #44ff44;">■</span> entrance
    </div>
  </div>

    // Condition modifiers
    const CONDITIONS = [
      'pristine', 'preserved', 'weathered', 'damaged', 'flooded', 
      'collapsed', 'reinforced', 'modified', 'abandoned', 'occupied',
    ];
    
    // Atmosphere descriptors
    const ATMOSPHERES = [
      'damp', 'dry', 'musty', 'stale', 'cold', 'warm', 
      'drafty', 'still', 'echoing', 'muffled',
    ];

    function key(p) { return `${p.x},${p.y},${p.z}`; }
    function manhattan(a, b) {
      return Math.abs(a.x - b.x) + Math.abs(a.y - b.y) + Math.abs(a.z - b.z);
    }

    function init() {
      const container = document.getElementById('container');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0f);
      scene.fog = new THREE.Fog(0x0a0a0f, 50, 150);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(30, 30, 30);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Lights
      const ambient = new THREE.AmbientLight(0x404060, 0.5);
      scene.add(ambient);

      const directional = new THREE.DirectionalLight(0xffffff, 1);
      directional.position.set(50, 50, 50);
      scene.add(directional);

      const directional2 = new THREE.DirectionalLight(0x8888ff, 0.5);
      directional2.position.set(-50, -30, -50);
      scene.add(directional2);

      // Grid helper at z=-10
      const grid = new THREE.GridHelper(100, 100, 0x222233, 0x111122);
      grid.position.y = -10 * 2; // z=-10, spacing=2
      scene.add(grid);

      window.addEventListener('resize', onResize);
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mousedown', onMouseDown);
      window.addEventListener('mouseup', onMouseUp);
      
      createCursorPreview();
      setupControls();
      generate();
      animate();
    }
    
    function createCursorPreview() {
      const geometry = new THREE.BoxGeometry(0.7, 0.7, 0.7);
      const material = new THREE.MeshBasicMaterial({ 
        color: 0xffff00, 
        transparent: true, 
        opacity: 0.4,
        wireframe: true
      });
      cursorPreview = new THREE.Mesh(geometry, material);
      cursorPreview.visible = false;
      scene.add(cursorPreview);
    }
    
    // WASD camera movement
    const moveSpeed = 1;
    const keys = { w: false, a: false, s: false, d: false };
    
    function onKeyDown(e) {
      const key = e.key.toLowerCase();
      
      // WASD movement
      if (key === 'w') keys.w = true;
      if (key === 'a') keys.a = true;
      if (key === 's') keys.s = true;
      if (key === 'd') keys.d = true;
      
      // Editor controls
      if (e.key === 'r' || e.key === 'R') {
        editorMode = editorMode === 'room' ? 'exit' : 'room';
        document.getElementById('editorMode').textContent = editorMode.toUpperCase();
        exitStartRoomId = null; // Reset exit selection
        updateCursorPreviewColor();
      } else if (e.key === 't' || e.key === 'T') {
        cycleRoomType();
      } else if (e.key === 'e' || e.key === 'E') {
        exportWorld();
      } else if (e.key === 'i' || e.key === 'I') {
        document.getElementById('jsonFileInput').click();
      } else if (e.key === 'q' || e.key === 'Q') {
        editorZ = Math.min(0, editorZ + 1); // Allow up to z=0
        document.getElementById('editorZ').textContent = editorZ;
        updateGroundPlane();
        updateCursorPreviewZ();
      } else if (key === 'z' && !e.ctrlKey) {
        editorZ = Math.max(-10, editorZ - 1); // Allow down to z=-10
        document.getElementById('editorZ').textContent = editorZ;
        updateGroundPlane();
        updateCursorPreviewZ();
      }
    }
    
    function onKeyUp(e) {
      const key = e.key.toLowerCase();
      if (key === 'w') keys.w = false;
      if (key === 'a') keys.a = false;
      if (key === 's') keys.s = false;
      if (key === 'd') keys.d = false;
    }
    
    function updateCameraMovement() {
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();
      
      const right = new THREE.Vector3();
      right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
      
      if (keys.w) {
        camera.position.add(forward.multiplyScalar(moveSpeed));
        controls.target.add(forward);
      }
      if (keys.s) {
        camera.position.sub(forward.multiplyScalar(moveSpeed));
        controls.target.sub(forward);
      }
      if (keys.a) {
        camera.position.sub(right.multiplyScalar(moveSpeed));
        controls.target.sub(right);
      }
      if (keys.d) {
        camera.position.add(right.multiplyScalar(moveSpeed));
        controls.target.add(right);
      }
    }
    
    function updateGroundPlane() {
      groundPlane.constant = -editorZ * 2; // spacing = 2
    }
    
    function updateCursorPreviewZ() {
      if (cursorPreview && cursorPreview.visible) {
        const spacing = 2;
        cursorPreview.position.y = editorZ * spacing;
      }
    }
    
    // Get room under cursor for T key
    function getHoveredRoom() {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(roomMeshes);
      if (intersects.length > 0) {
        const roomId = intersects[0].object.userData.roomId;
        if (roomId !== undefined) {
          return findRoomById(roomId);
        }
      }
      return null;
    }
    
    function cycleRoomType() {
      const room = getHoveredRoom();
      if (!room) return;
      
      const currentType = room.meta?.roomType || 'tunnel';
      const currentIndex = ROOM_TYPES.indexOf(currentType);
      const nextIndex = (currentIndex + 1) % ROOM_TYPES.length;
      
      if (!room.meta) room.meta = {};
      room.meta.roomType = ROOM_TYPES[nextIndex];
      
      console.log('Room', room.id, 'type changed to', room.meta.roomType);
      refreshVisualization();
    }
    
    function classifyRoomTypes() {
      if (!currentWorld) return;
      
      // Build adjacency map
      const exitCount = new Map();
      for (const exit of currentWorld.exits) {
        exitCount.set(exit.from, (exitCount.get(exit.from) || 0) + 1);
      }
      
      const entranceSet = new Set(currentEntrances.map(e => key(e)));
      
      for (const room of currentWorld.rooms) {
        // Skip if already manually set
        if (room.meta?.roomType) continue;
        
        if (!room.meta) room.meta = {};
        
        // Entrance rooms
        if (entranceSet.has(key(room.pos))) {
          room.meta.roomType = 'entrance';
        }
        // Prefab rooms are 'room' type
        else if (room.meta?.prefabId) {
          room.meta.roomType = 'room';
        }
        else {
          // 50/50 railway vs room based on position seed
          const seed = Math.abs(room.pos.x * 73856093 ^ room.pos.y * 19349663 ^ room.pos.z * 83492791);
          const rand = ((seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
          
          // Rooms with 3+ exits slightly favor 'room' type (60% room, 40% railway)
          // Rooms with 1-2 exits favor 'railway' type (40% room, 60% railway)
          const exits = exitCount.get(room.id) || 0;
          const roomChance = exits >= 3 ? 0.6 : 0.4;
          
          room.meta.roomType = rand < roomChance ? 'room' : 'railway';
        }
      }
    }
    
    // Seeded random for consistent room features
    function seededRandom(seed) {
      let s = seed;
      return function() {
        s = (s * 1103515245 + 12345) & 0x7fffffff;
        return s / 0x7fffffff;
      };
    }
    
    function enrichRoomMetadata() {
      if (!currentWorld) return;
      
      // Build adjacency and exit direction maps
      const roomById = new Map();
      const exitsByRoom = new Map();
      const neighborTypes = new Map();
      
      for (const room of currentWorld.rooms) {
        roomById.set(room.id, room);
        exitsByRoom.set(room.id, []);
      }
      
      for (const exit of currentWorld.exits) {
        exitsByRoom.get(exit.from)?.push(exit);
      }
      
      // Calculate depth from nearest entrance (BFS)
      const entranceSet = new Set(currentEntrances.map(e => key(e)));
      const entranceRoomIds = currentWorld.rooms
        .filter(r => entranceSet.has(key(r.pos)))
        .map(r => r.id);
      
      const depth = new Map();
      const queue = entranceRoomIds.map(id => ({ id, d: 0 }));
      entranceRoomIds.forEach(id => depth.set(id, 0));
      
      while (queue.length) {
        const { id, d } = queue.shift();
        for (const exit of exitsByRoom.get(id) || []) {
          if (!depth.has(exit.to)) {
            depth.set(exit.to, d + 1);
            queue.push({ id: exit.to, d: d + 1 });
          }
        }
      }
      
      // Enrich each room
      for (const room of currentWorld.rooms) {
        if (!room.meta) room.meta = {};
        
        const z = room.pos.z;
        const exits = exitsByRoom.get(room.id) || [];
        
        // Era based on z-level
        room.meta.era = Z_ERA[String(z)] || 'victorian';
        
        // Cardinal directions
        const cardinals = { north: false, south: false, east: false, west: false, up: false, down: false };
        for (const exit of exits) {
          const neighbor = roomById.get(exit.to);
          if (!neighbor) continue;
          
          const dx = neighbor.pos.x - room.pos.x;
          const dy = neighbor.pos.y - room.pos.y;
          const dz = neighbor.pos.z - room.pos.z;
          
          if (dz > 0) cardinals.up = true;
          else if (dz < 0) cardinals.down = true;
          else if (dy > 0) cardinals.north = true;
          else if (dy < 0) cardinals.south = true;
          else if (dx > 0) cardinals.east = true;
          else if (dx < 0) cardinals.west = true;
        }
        room.meta.exits = cardinals;
        room.meta.exitCount = exits.length;
        
        // Depth from entrance
        room.meta.depth = depth.get(room.id) ?? 999;
        
        // Seeded random features based on position
        const seed = Math.abs(room.pos.x * 73856093 ^ room.pos.y * 19349663 ^ room.pos.z * 83492791);
        const rand = seededRandom(seed);
        
        // Condition (weighted by depth and z-level)
        const conditionRoll = rand();
        if (room.meta.roomType === 'entrance') {
          room.meta.condition = 'preserved';
        } else if (z <= -5) {
          room.meta.condition = conditionRoll < 0.3 ? 'collapsed' : conditionRoll < 0.6 ? 'damaged' : 'weathered';
        } else if (z === -4) {
          room.meta.condition = conditionRoll < 0.2 ? 'reinforced' : conditionRoll < 0.5 ? 'modified' : 'industrial';
        } else if (z === -3) {
          room.meta.condition = conditionRoll < 0.15 ? 'flooded' : conditionRoll < 0.4 ? 'damp' : 'weathered';
        } else {
          room.meta.condition = conditionRoll < 0.1 ? 'collapsed' : conditionRoll < 0.3 ? 'damaged' : 'preserved';
        }
        
        // Atmosphere
        const atmRoll = rand();
        const atmIdx = Math.floor(atmRoll * ATMOSPHERES.length);
        room.meta.atmosphere = ATMOSPHERES[atmIdx];
        
        // 2-5 features based on era, with contextual filtering
        const eraFeatures = FEATURES[room.meta.era] || FEATURES.victorian;
        const availableFeatures = [...(eraFeatures.common || [])];
        
        // Add surface-only features if near surface
        if (room.meta.nearSurface && eraFeatures.surface_only) {
          availableFeatures.push(...eraFeatures.surface_only);
        }
        
        // Add deep-only features if deep
        if (room.meta.isDeep && eraFeatures.deep_only) {
          availableFeatures.push(...eraFeatures.deep_only);
        }
        
        // Add water-adjacent features if near water
        if (room.meta.nearWater && eraFeatures.water_adjacent) {
          availableFeatures.push(...eraFeatures.water_adjacent);
        }
        
        // Add flooded features for deep water areas
        if (room.meta.isDeep && room.meta.nearWater && eraFeatures.flooded) {
          availableFeatures.push(...eraFeatures.flooded);
        }
        
        // Add cartel secure features for deep industrial areas
        if (room.meta.era === 'industrial' && room.meta.isDeep && eraFeatures.cartel_secure) {
          availableFeatures.push(...eraFeatures.cartel_secure);
        }
        
        const featureCount = 2 + Math.floor(rand() * 4); // 2-5 features
        room.meta.features = [];
        const usedFeatures = new Set();
        for (let i = 0; i < featureCount && availableFeatures.length > 0; i++) {
          const idx = Math.floor(rand() * availableFeatures.length);
          const feature = availableFeatures[idx];
          if (!usedFeatures.has(feature)) {
            room.meta.features.push(feature);
            usedFeatures.add(feature);
          }
        }
        
        // Neighbor context
        room.meta.neighborTypes = [];
        for (const exit of exits) {
          const neighbor = roomById.get(exit.to);
          if (neighbor?.meta?.roomType && !room.meta.neighborTypes.includes(neighbor.meta.roomType)) {
            room.meta.neighborTypes.push(neighbor.meta.roomType);
          }
        }
        
        // Is this a dead end, corridor, junction, or hub?
        if (exits.length === 1) room.meta.topology = 'dead_end';
        else if (exits.length === 2) room.meta.topology = 'corridor';
        else if (exits.length === 3) room.meta.topology = 'junction';
        else room.meta.topology = 'hub';
        
        // Is this near water (low y values near waterfront)?
        room.meta.nearWater = room.pos.x <= -18 || (room.pos.y <= -10);
        
        // Is this near surface?
        room.meta.nearSurface = room.meta.depth <= 3;
        
        // Is this deep underground?
        room.meta.isDeep = z <= -4;
      }
      
      console.log('Enriched metadata for', currentWorld.rooms.length, 'rooms');
    }

    function updateCursorPreviewColor() {
      if (!cursorPreview) return;
      const color = editorMode === 'room' ? 0xffff00 : (exitStartRoomId !== null ? 0xff8800 : 0x00ffff);
      cursorPreview.material.color.setHex(color);
    }
    
    function getGridPosition(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersect = new THREE.Vector3();
      raycaster.ray.intersectPlane(groundPlane, intersect);
      
      if (!intersect) return null;
      
      const spacing = 2;
      const x = Math.round(intersect.x / spacing);
      const y = Math.round(intersect.z / spacing); // z in 3D = y in 2D world
      const z = editorZ;
      
      return { x, y, z };
    }
    
    function onMouseMove(e) {
      if (!cursorPreview) return;
      
      const pos = getGridPosition(e);
      if (pos) {
        const spacing = 2;
        cursorPreview.position.set(pos.x * spacing, pos.z * spacing, pos.y * spacing);
        cursorPreview.visible = true;
      } else {
        cursorPreview.visible = false;
      }
    }
    
    function findRoomAtPosition(pos) {
      if (!currentWorld || !pos) return null;
      return currentWorld.rooms.find(r => 
        r.pos && r.pos.x === pos.x && r.pos.y === pos.y && r.pos.z === pos.z
      ) || null;
    }
    
    function findRoomById(id) {
      if (!currentWorld) return null;
      return currentWorld.rooms.find(r => r.id === id);
    }
    
    function getRoomUnderMouse(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(roomMeshes);
      
      if (intersects.length > 0) {
        const roomId = intersects[0].object.userData.roomId;
        if (roomId !== undefined) {
          return findRoomById(roomId);
        }
      }
      return null;
    }
    
    function getExitUnderMouse(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(exitMeshes);
      
      if (intersects.length > 0) {
        const exitFrom = intersects[0].object.userData.exitFrom;
        const exitTo = intersects[0].object.userData.exitTo;
        if (exitFrom !== undefined && exitTo !== undefined) {
          return { from: exitFrom, to: exitTo };
        }
      }
      return null;
    }
    
    function deleteExit(fromId, toId) {
      if (!currentWorld) return;
      
      // Disable controls temporarily to prevent view jump
      controls.enabled = false;
      
      // Remove both directions of the exit
      currentWorld.exits = currentWorld.exits.filter(e => 
        !((e.from === fromId && e.to === toId) || (e.from === toId && e.to === fromId))
      );
      
      console.log('Deleted exit between', fromId, 'and', toId);
      
      refreshVisualization();
      
      // Re-enable controls after a short delay
      requestAnimationFrame(() => {
        controls.enabled = true;
      });
    }
    
    function onMouseDown(e) {
      if (e.button === 0) {
        mouseDownPos = { x: e.clientX, y: e.clientY };
      }
    }
    
    function onMouseUp(e) {
      if (e.button !== 0 || !mouseDownPos) return;
      
      // Check if it was a drag (moved more than threshold)
      const dx = e.clientX - mouseDownPos.x;
      const dy = e.clientY - mouseDownPos.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      
      mouseDownPos = null;
      
      if (distance > DRAG_THRESHOLD) {
        // It was a drag, not a click
        return;
      }
      
      // It was a click - handle it
      handleClick(e);
    }
    
    function handleClick(e) {
      // Ignore if clicking on UI
      if (e.target.closest('#controls') || e.target.closest('#stats') || e.target.closest('#editor-status')) return;
      
      const pos = getGridPosition(e);
      
      // For exit mode, use raycast to detect rooms directly
      const clickedRoom = getRoomUnderMouse(e);
      const clickedExit = getExitUnderMouse(e);
      const existingRoom = clickedRoom || (pos ? findRoomAtPosition(pos) : null);
      
      console.log('Click at', pos, 'mode:', editorMode, 'clickedRoom:', clickedRoom?.id, 'clickedExit:', clickedExit, 'existingRoom:', existingRoom?.id);
      
      if (e.shiftKey) {
        // Delete mode - stop event to prevent camera jump
        e.stopPropagation();
        e.preventDefault();
        
        // Try deleting exit first (if clicked on one), then room
        if (clickedExit) {
          deleteExit(clickedExit.from, clickedExit.to);
        } else if (existingRoom) {
          deleteRoom(existingRoom);
        }
      } else {
        // Add mode
        if (editorMode === 'room') {
          if (pos && !existingRoom) {
            addRoom(pos);
          }
        } else {
          // Exit mode - only works on existing rooms
          if (existingRoom && existingRoom.id) {
            if (exitStartRoomId === null) {
              exitStartRoomId = existingRoom.id;
              console.log('Exit start room:', exitStartRoomId);
              updateCursorPreviewColor();
            } else if (exitStartRoomId !== existingRoom.id) {
              const startRoom = findRoomById(exitStartRoomId);
              console.log('Creating exit from', exitStartRoomId, 'to', existingRoom.id);
              if (startRoom && startRoom.id) {
                addExit(startRoom, existingRoom);
              }
              exitStartRoomId = null;
              updateCursorPreviewColor();
            }
          }
        }
      }
    }
    
    function addRoom(pos) {

      const maxNumericId = currentWorld.rooms

        .reduce((max, id) => Math.max(max, id), 0);
      const newId = `r${maxNumericId + 1}`;

    function visualizeWorld(world, entrances) {
      const spacing = 2;
      const roomSize = 0.6;
      
      const roomPosById = new Map();

      // Create room meshes
      const entranceSet = new Set(entrances.map(e => key(e)));
      
      for (const room of world.rooms) {
        const pos = new THREE.Vector3(room.pos.x * spacing, room.pos.z * spacing, room.pos.y * spacing);
        roomPosById.set(room.id, pos);

        // Get room type and colors
        const roomType = room.meta?.roomType || 'room';
        const colors = ROOM_COLORS[roomType] || ROOM_COLORS.room;
        let color = colors.color;
        let emissive = colors.emissive;
        let scale = roomType === 'entrance' ? 1.3 : 1;

        const geometry = new THREE.BoxGeometry(roomSize * scale, roomSize * scale, roomSize * scale);
        const material = new THREE.MeshStandardMaterial({
          color,
          emissive,
          metalness: 0.3,
          roughness: 0.7,
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.copy(pos);
        mesh.userData.roomId = room.id; // Store room ID for raycast detection
        
        if (room.meta?.isPortal) {
          const wireGeo = new THREE.BoxGeometry(roomSize * scale * 1.2, roomSize * scale * 1.2, roomSize * scale * 1.2);
          const wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.3 });
          const wire = new THREE.Mesh(wireGeo, wireMat);
          mesh.add(wire);
        }

        scene.add(mesh);
        roomMeshes.push(mesh);
      }

      // Create exit lines (deduplicated bidirectional)
      const drawnEdges = new Set();
      const linePoints = [];
      
      for (const exit of world.exits) {
        const edgeKey = [exit.from, exit.to].sort().join('-');
        if (drawnEdges.has(edgeKey)) continue;
        drawnEdges.add(edgeKey);

        const p1 = roomPosById.get(exit.from);
        const p2 = roomPosById.get(exit.to);
        if (!p1 || !p2) continue;

        linePoints.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
        
        // Create individual clickable tube for this exit
        const direction = new THREE.Vector3().subVectors(p2, p1);
        const length = direction.length();
        const midpoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
        
        // Use a thin cylinder for better raycasting than lines
        const tubeGeometry = new THREE.CylinderGeometry(0.15, 0.15, length, 4);
        const tubeMaterial = new THREE.MeshBasicMaterial({ 
          color: 0x336699, 
          transparent: true, 
          opacity: 0.01 // Nearly invisible - the LineSegments handle visual
        });
        const tube = new THREE.Mesh(tubeGeometry, tubeMaterial);
        tube.position.copy(midpoint);
        tube.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
        tube.userData.exitFrom = exit.from;
        tube.userData.exitTo = exit.to;
        scene.add(tube);
        exitMeshes.push(tube);
      }

      const lineGeometry = new THREE.BufferGeometry();
      lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePoints, 3));
      const lineMaterial = new THREE.LineBasicMaterial({ color: 0x336699, transparent: true, opacity: 0.4 });
      const lineSegments = new THREE.LineSegments(lineGeometry, lineMaterial);
      scene.add(lineSegments);
      lineMeshes.push(lineSegments);

      // Center camera on world
      const center = new THREE.Vector3();
      for (const room of world.rooms) {
        center.add(roomPosById.get(room.id));
      }
      center.divideScalar(world.rooms.length);
      controls.target.copy(center);
    }

    function updateStats(world) {
      document.getElementById('roomCount').textContent = world.rooms.length;
      document.getElementById('exitCount').textContent = world.exits.length / 2; // Bidirectional
      
      const prefabInstances = new Set(world.rooms.filter(r => r.meta?.prefabInstanceId).map(r => r.meta.prefabInstanceId));
      document.getElementById('prefabCount').textContent = prefabInstances.size;

      // Verify connectivity
      const adj = new Map();
      for (const ex of world.exits) {
        if (!adj.has(ex.from)) adj.set(ex.from, []);
        adj.get(ex.from).push(ex.to);
      }
      const visited = new Set();
      const queue = [world.rooms[0].id];
      visited.add(queue[0]);
      while (queue.length) {
        const cur = queue.shift();
        for (const n of adj.get(cur) || []) {
          if (!visited.has(n)) { visited.add(n); queue.push(n); }
        }
      }
      const connected = visited.size === world.rooms.length;
      const el = document.getElementById('connected');
      el.textContent = connected ? '✓' : '✗';
      el.style.color = connected ? '#4f4' : '#f44';
    }

    function animate() {
      requestAnimationFrame(animate);
      updateCameraMovement();
      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
