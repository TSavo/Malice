<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malice World Map - 3D Visualization</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: monospace;
      background: #000;
      color: #0f0;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border: 1px solid #0f0;
      max-width: 300px;
      z-index: 100;
    }
    #info h2 {
      margin: 0 0 10px 0;
      color: #0ff;
    }
    #tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.9);
      padding: 10px;
      border: 1px solid #0ff;
      pointer-events: none;
      display: none;
      max-width: 400px;
      z-index: 100;
    }
    #tooltip h3 {
      margin: 0 0 5px 0;
      color: #0ff;
    }
    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border: 1px solid #0f0;
    }
    button {
      background: #000;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 5px 10px;
      margin: 2px;
      cursor: pointer;
      font-family: monospace;
    }
    button:hover {
      background: #0f0;
      color: #000;
    }
    button.active {
      background: #0f0;
      color: #000;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: #0ff;
      z-index: 200;
    }
    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: #f00;
      z-index: 200;
      text-align: center;
      display: none;
    }
    #status {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border: 1px solid #0f0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading world data...</div>
  <div id="error">
    <div>Failed to load map data</div>
    <button onclick="loadMapData()">Retry</button>
  </div>
  <div id="info">
    <h2>Malice World Map</h2>
    <div id="stats"></div>
  </div>
  <div id="tooltip">
    <h3 id="tooltip-title"></h3>
    <div id="tooltip-content"></div>
  </div>
  <div id="controls">
    <button onclick="viewSurface()">Surface (z=0)</button>
    <button onclick="viewUnderground()">Underground</button>
    <button onclick="viewTower()">Smith Tower</button>
    <button onclick="viewAll()">View All</button>
    <span style="margin-left: 10px; color: #666">|</span>
    <button id="refreshBtn" onclick="toggleAutoRefresh()">Auto-Refresh: OFF</button>
  </div>
  <div id="status">
    <span id="lastUpdate">Last update: --</span>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Configuration
    const isAdmin = false; // Injected by server for /admin/map
    const API_URL = '/api/map/rooms';
    const REFRESH_INTERVAL = isAdmin ? 3000 : 30000; // 3s for admin, 30s for public

    // State
    let worldData = [];
    let exitsData = [];
    let autoRefresh = false;
    let refreshTimer = null;
    let scene, camera, renderer, controls;
    let roomGroup, exitGroup;

    // Scene setup
    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      scene.fog = new THREE.Fog(0x000000, 50, 300);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 50, 100);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x404040, 1);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
      directionalLight.position.set(50, 100, 50);
      scene.add(directionalLight);

      // Grid helper
      const gridHelper = new THREE.GridHelper(200, 50, 0x00ff00, 0x003300);
      scene.add(gridHelper);

      // Add axes helper
      const axesHelper = new THREE.AxesHelper(50);
      scene.add(axesHelper);

      // Groups for rooms and exits
      roomGroup = new THREE.Group();
      exitGroup = new THREE.Group();
      scene.add(roomGroup);
      scene.add(exitGroup);

      // Event listeners
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('resize', onResize);

      // Start animation loop
      animate();
    }

    // Create materials for different z-levels
    function getColorForZ(z) {
      if (z < 0) {
        // Underground - darker blue to deep purple gradient
        const depth = Math.abs(z);
        const hue = 0.65 - depth * 0.05;
        const lightness = Math.max(0.15, 0.5 - depth * 0.05);
        return new THREE.Color().setHSL(hue, 0.9, lightness);
      } else if (z === 0) {
        // Surface - bright green
        return new THREE.Color(0x00ff00);
      } else {
        // Above ground - yellow to red gradient
        return new THREE.Color().setHSL(0.15 - z * 0.003, 0.9, 0.5);
      }
    }

    function getMaterialOpacity(z) {
      if (z < 0) {
        return 0.9;
      }
      return 0.8;
    }

    // Build/rebuild room cubes
    function buildRooms() {
      // Clear existing rooms
      while (roomGroup.children.length > 0) {
        roomGroup.remove(roomGroup.children[0]);
      }

      const roomSize = 1.8;
      const geometry = new THREE.BoxGeometry(roomSize, roomSize, roomSize);

      worldData.forEach(room => {
        const color = getColorForZ(room.z);
        const material = new THREE.MeshPhongMaterial({
          color: color,
          transparent: true,
          opacity: getMaterialOpacity(room.z),
          emissive: color,
          emissiveIntensity: room.z < 0 ? 0.3 : 0.2,
          shininess: room.z < 0 ? 10 : 30,
        });

        const cube = new THREE.Mesh(geometry, material);
        cube.position.set(room.x * 2, room.z * 2, -room.y * 2);
        cube.userData = room;
        roomGroup.add(cube);
      });
    }

    // Build exit connections as tubes
    function buildExits() {
      // Clear existing exits
      while (exitGroup.children.length > 0) {
        exitGroup.remove(exitGroup.children[0]);
      }

      const exitMaterial = new THREE.MeshBasicMaterial({
        color: 0xff0000,
        transparent: true,
        opacity: 0.4,
      });

      exitsData.forEach(exit => {
        const from = new THREE.Vector3(exit.from.x * 2, exit.from.z * 2, -exit.from.y * 2);
        const to = new THREE.Vector3(exit.to.x * 2, exit.to.z * 2, -exit.to.y * 2);

        // Create a tube between the two points
        const direction = new THREE.Vector3().subVectors(to, from);
        const length = direction.length();

        if (length > 0) {
          const tubeGeometry = new THREE.CylinderGeometry(0.1, 0.1, length, 6);
          const tube = new THREE.Mesh(tubeGeometry, exitMaterial);

          // Position at midpoint
          tube.position.copy(from).add(to).multiplyScalar(0.5);

          // Rotate to point from -> to
          tube.quaternion.setFromUnitVectors(
            new THREE.Vector3(0, 1, 0),
            direction.clone().normalize()
          );

          exitGroup.add(tube);
        }
      });
    }

    // Update stats display
    function updateStats() {
      const zLevels = [...new Set(worldData.map(r => r.z))].sort((a, b) => b - a);
      const stats = document.getElementById('stats');
      stats.innerHTML =
        '<strong>Total Rooms:</strong> ' + worldData.length + '<br>' +
        '<strong>Exits:</strong> ' + exitsData.length + '<br>' +
        '<strong>Z-Levels:</strong> ' + Math.min(...zLevels) + ' to ' + Math.max(...zLevels) + '<br>' +
        '<strong>Levels:</strong> ' + zLevels.length + '<br>' +
        '<br>' +
        '<strong>Controls:</strong><br>' +
        'Left Click + Drag: Rotate<br>' +
        'Right Click + Drag: Pan<br>' +
        'Scroll: Zoom<br>' +
        '<br>' +
        '<strong>Colors:</strong><br>' +
        '<span style="color: #4444aa">Dark Blue</span>: Deep underground<br>' +
        '<span style="color: #6666ff">Light Blue</span>: Shallow underground<br>' +
        '<span style="color: #00ff00">Green</span>: Surface (z=0)<br>' +
        '<span style="color: #ffaa00">Yellow/Orange</span>: Buildings<br>' +
        '<span style="color: #ff6600">Red</span>: High floors<br>' +
        '<span style="color: #ff0000">Red tubes</span>: Exit connections<br>' +
        '<br>' +
        '<em>Hover over rooms for details</em>';
    }

    // Fetch data from API
    async function loadMapData() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');

      loading.style.display = 'block';
      error.style.display = 'none';

      try {
        const response = await fetch(API_URL);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        worldData = data.rooms || [];
        exitsData = data.exits || [];

        loading.style.display = 'none';

        buildRooms();
        buildExits();
        updateStats();

        // Update timestamp
        const now = new Date();
        document.getElementById('lastUpdate').textContent =
          'Last update: ' + now.toLocaleTimeString();

      } catch (err) {
        console.error('Failed to load map data:', err);
        loading.style.display = 'none';
        error.style.display = 'block';
      }
    }

    // Auto-refresh toggle
    window.toggleAutoRefresh = function() {
      autoRefresh = !autoRefresh;
      const btn = document.getElementById('refreshBtn');

      if (autoRefresh) {
        btn.textContent = 'Auto-Refresh: ON';
        btn.classList.add('active');
        refreshTimer = setInterval(loadMapData, REFRESH_INTERVAL);
      } else {
        btn.textContent = 'Auto-Refresh: OFF';
        btn.classList.remove('active');
        if (refreshTimer) {
          clearInterval(refreshTimer);
          refreshTimer = null;
        }
      }
    };

    // View presets
    window.viewSurface = () => {
      camera.position.set(0, 80, 0);
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
    };

    window.viewUnderground = () => {
      camera.position.set(-20, -10, 40);
      camera.lookAt(-10, -8, 0);
      controls.target.set(-10, -8, 0);
    };

    window.viewTower = () => {
      camera.position.set(-25, 40, 30);
      camera.lookAt(-12, 20, -10);
      controls.target.set(-12, 20, -10);
    };

    window.viewAll = () => {
      camera.position.set(0, 50, 100);
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
    };

    // Raycaster for hover effects
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredObject = null;
    const tooltip = document.getElementById('tooltip');
    const tooltipTitle = document.getElementById('tooltip-title');
    const tooltipContent = document.getElementById('tooltip-content');

    function getLevelName(z) {
      if (z < 0) return `Underground Level ${Math.abs(z)}`;
      if (z === 0) return 'Surface';
      if (z <= 5) return `Ground Floor + ${z}`;
      return `Floor ${z}`;
    }

    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(roomGroup.children);

      // Reset previous hover
      if (hoveredObject) {
        const wasUnderground = hoveredObject.userData.z < 0;
        hoveredObject.material.emissiveIntensity = wasUnderground ? 0.3 : 0.2;
        hoveredObject = null;
      }

      // Hide tooltip by default
      tooltip.style.display = 'none';

      if (intersects.length > 0) {
        hoveredObject = intersects[0].object;
        hoveredObject.material.emissiveIntensity = 0.7;

        // Show tooltip
        const room = hoveredObject.userData;
        tooltipTitle.textContent = room.name || 'Unknown Room';
        tooltipContent.innerHTML =
          '<strong>Coordinates:</strong> (' + room.x + ', ' + room.y + ', ' + room.z + ')<br>' +
          '<strong>Level:</strong> ' + getLevelName(room.z);

        tooltip.style.display = 'block';
        tooltip.style.left = `${event.clientX + 15}px`;
        tooltip.style.top = `${event.clientY + 15}px`;
      }
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // Initialize
    initScene();
    loadMapData();

    // Make loadMapData available globally for retry button
    window.loadMapData = loadMapData;
  </script>
</body>
</html>
