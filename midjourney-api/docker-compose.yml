services:
  midjourney-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DEBUG=true
      - SERVER_ID=${SERVER_ID}
      - CHANNEL_ID=${CHANNEL_ID}
      - SALAI_TOKEN=${SALAI_TOKEN}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - OUTPUT_DIR=/app/outputs
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
