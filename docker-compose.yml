services:
  mongodb:
    image: mongo:7.0
    container_name: malice-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=malice
    networks:
      - malice-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malice-game
    restart: unless-stopped
    ports:
      # Static services (admin/dev)
      - "80:80"        # Main website
      - "3000:3000"    # LSP API (VS Code extension)
      - "3010:3010"    # MCP (code-first - admin access)
      - "9999:9999"    # DevTools WebSocket (VS Code extension)
      # Per-faction transport ports (ranges for up to 20 factions)
      # Faction N: HTTP=8000+N, WS=8080+N, Telnet=5555+N*2, SSH=5556+N*2, SessionMCP=3012+N
      - "8000-8019:8000-8019"    # Faction HTTP servers
      - "8080-8099:8080-8099"    # Faction WebSocket servers
      - "5555-5594:5555-5594"    # Faction Telnet + SSH servers
      - "3012-3031:3012-3031"    # Faction Session MCP servers
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - DB_NAME=malice
      - NODE_ENV=production
      - FORCE_BOOTSTRAP=${FORCE_BOOTSTRAP:-false}
    volumes:
      # Named volume for Claude SDK sessions (AI NPC conversation history)
      - claude_sessions:/home/node/.claude
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - malice-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3010 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  mongodb_data:
    driver: local
  claude_sessions:
    driver: local

networks:
  malice-network:
    driver: bridge
