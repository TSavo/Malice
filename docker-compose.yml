services:
  mongodb:
    image: mongo:7.0
    container_name: malice-mongo
    restart: unless-stopped
    # No ports exposed - only accessible within Docker network
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=malice
    networks:
      malice-network:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  game:
    image: malice-game:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malice-game
    restart: unless-stopped
    ports:
      # ============================================================
      # Admin/dev services - localhost only (access via SSH tunnel)
      # ssh -L 3010:localhost:3010 root@malice-prod
      # ============================================================
      - "127.0.0.1:3000:3000"    # LSP API (VS Code extension)
      - "127.0.0.1:3010:3010"    # MCP (code-first - admin access)
      - "127.0.0.1:9999:9999"    # DevTools WebSocket (VS Code extension)
      # ============================================================
      # Faction ports - internal only, accessed via Caddy reverse proxy
      # Not bound to host - Caddy connects via Docker network
      # ============================================================
      # Session MCP - localhost only for AI client access via SSH tunnel
      - "127.0.0.1:3012:3012"    # Continuum Session MCP
      - "127.0.0.1:3013:3013"    # Cartel Session MCP
      - "127.0.0.1:3014:3014"    # Neural Log Session MCP
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - DB_NAME=malice
      - NODE_ENV=production
      - FORCE_BOOTSTRAP=${FORCE_BOOTSTRAP:-false}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - LAOZHANG_API_KEY=${LAOZHANG_API_KEY:-}
    volumes:
      - claude_sessions:/home/bun/.claude
      - ./assets/images:/app/assets/images
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      malice-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3010 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ============================================================
  # Caddy - Reverse proxy with automatic HTTPS
  # Routes all domains to correct game ports
  # ============================================================

  caddy:
    image: caddy:2-alpine
    container_name: malice-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      game:
        condition: service_healthy
    networks:
      malice-network:
        ipv4_address: 172.20.0.50

volumes:
  mongodb_data:
    driver: local
  claude_sessions:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  malice-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
