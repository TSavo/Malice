services:
  mongodb:
    image: mongo:7.0
    container_name: malice-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=malice
    networks:
      malice-network:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malice-game
    restart: unless-stopped
    ports:
      # Admin/dev services - exposed for local development
      - "3000:3000"    # LSP API (VS Code extension)
      - "3010:3010"    # MCP (code-first - admin access)
      - "9999:9999"    # DevTools WebSocket (VS Code extension)
      # Faction ports - accessed via Caddy in production, direct in dev
      - "8000-8019:8000-8019"    # Faction HTTP servers
      - "8080-8099:8080-8099"    # Faction WebSocket servers
      - "3012-3031:3012-3031"    # Faction Session MCP servers
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - DB_NAME=malice
      - NODE_ENV=production
      - FORCE_BOOTSTRAP=${FORCE_BOOTSTRAP:-false}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
    volumes:
      - claude_sessions:/home/node/.claude
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      malice-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3010 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ============================================================
  # Caddy - Reverse proxy with automatic HTTPS
  # Routes all domains to correct game ports
  # ============================================================

  caddy:
    image: caddy:2-alpine
    container_name: malice-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      game:
        condition: service_healthy
    networks:
      malice-network:
        ipv4_address: 172.20.0.50

volumes:
  mongodb_data:
    driver: local
  claude_sessions:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  malice-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
