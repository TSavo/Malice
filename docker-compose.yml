services:
  mongodb:
    image: mongo:7.0
    container_name: malice-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=malice
    networks:
      - malice-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malice-game
    restart: unless-stopped
    ports:
      - "5555:5555"  # Telnet
      - "5556:5556"  # SSH
      - "8080:8080"  # WebSocket
      - "3001:3001"  # MCP
      - "3002:3002"  # CharGen MCP
      - "3003:3003"  # Session MCP
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - DB_NAME=malice
      - NODE_ENV=production
      - FORCE_BOOTSTRAP=${FORCE_BOOTSTRAP:-false}
    volumes:
      # Named volume for Claude SDK sessions (AI NPC conversation history)
      - claude_sessions:/home/node/.claude
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - malice-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3001 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  mongodb_data:
    driver: local
  claude_sessions:
    driver: local

networks:
  malice-network:
    driver: bridge
